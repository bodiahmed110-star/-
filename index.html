ckground:var(--green);color:#fff}.mushaf-shell{height:100%;position:relative;display:flex;flex-direction:column;background:var(--paper)}.mushaf-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:rgba(255,253,246,.95);border-bottom:1px solid rgba(90,72,45,.12);z-index:3}.mushaf-top .center{font-size:12px;color:#655c49;font-weight:700}.mushaf-page{flex:1;min-height:0;position:relative;overflow:hidden;background:#f8f3e5}.page-canvas{position:absolute;inset:0;overflow:auto;padding:32px clamp(18px,5vw,58px) 74px;display:flex;flex-direction:column}.page-canvas.drag{transition:transform .12s ease}.page-frame{min-height:100%;border:1px solid rgba(120,88,38,.18);border-radius:10px;padding:22px 18px 30px;background:linear-gradient(180deg,#fffdf7,#f5eedc);box-shadow:inset 0 0 0 6px rgba(183,152,82,.04),0 10px 35px rgba(49,39,18,.10);position:relative}.page-frame:before,.page-frame:after{content:"";position:absolute;inset:9px;border:1px solid rgba(183,152,82,.16);border-radius:7px;pointer-events:none}.page-title{text-align:center;font-family:Amiri,serif;font-size:24px;color:#5a4a2f;margin:6px 0 18px}.basmala{text-align:center;font-family:Amiri,serif;font-size:25px;color:#2d2b26;margin:8px 0 18px}.ayahs{font-family:Amiri,serif;font-size:25px;line-height:2.28;text-align:justify;color:#181715;position:relative;z-index:1}.ayah{display:inline;border-radius:8px;padding:2px 3px;cursor:pointer;transition:.15s}.ayah.selected{background:#ebdfba;box-shadow:inset 0 0 0 1px rgba(156,120,54,.28)}.ayah-mark{display:inline-grid;place-items:center;vertical-align:middle;width:32px;height:32px;margin:0 5px;font-family:Amiri,serif;font-size:18px;color:#765f2f;border:1px solid rgba(117,95,47,.55);border-radius:50%;background:rgba(255,252,240,.7)}.loading{text-align:center;color:var(--muted);padding:35px 10px}.page-footer{position:absolute;left:0;right:0;bottom:7px;text-align:center;z-index:2}.page-number{display:inline-flex;align-items:center;justify-content:center;min-width:68px;height:38px;padding:0 14px;background:#efe2ba;border:1px solid #ad9251;color:#5d4b27;font-weight:800;border-radius:50% / 38%;box-shadow:0 5px 12px rgba(87,67,26,.10);font-family:Amiri,serif}.mushaf-controls{height:64px;background:rgba(255,253,246,.96);border-top:1px solid rgba(90,72,45,.12);display:flex;align-items:center;justify-content:center;gap:14px;z-index:4}.reader-btn{width:44px;height:44px;border-radius:13px;background:#f0e8d4;color:#4a412d;display:grid;place-items:center;font-size:18px}.reader-btn.primary{background:var(--green);color:#fff}.reader-swipe-hint{position:absolute;top:66px;left:12px;right:12px;text-align:center;font-size:11px;color:rgba(62,52,35,.72);pointer-events:none;z-index:2}.bottomnav{height:var(--nav);border-top:1px solid var(--line);background:rgba(251,249,241,.97);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 6px calc(5px + env(safe-area-inset-bottom));z-index:10}.navbtn{background:transparent;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#748079}.navbtn b{font-size:18px;line-height:1}.navbtn.active{background:#eee7d5;color:var(--green);font-weight:700}.reader .bottomnav{display:none}.reader-fullscreen .topbar,.reader-fullscreen .bottomnav{display:none}.reader-fullscreen .screen{padding:0}.modal{position:fixed;inset:0;background:rgba(21,30,25,.47);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(5px)}.modal-card{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 15px 24px;box-shadow:0 -18px 50px rgba(0,0,0,.20)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modal-head h3{margin:0}.close{width:40px;height:40px;border-radius:12px;background:#ece5d2}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1c2e25;color:#fff;padding:10px 14px;border-radius:13px;font-size:12px;z-index:150;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.counter{font-size:68px;font-weight:800;text-align:center;letter-spacing:-2px;color:var(--green);font-variant-numeric:tabular-nums;margin:25px 0}.tasbeeh-btn{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2d7254,#143a2b);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 18px 45px rgba(20,58,43,.28),inset 0 0 0 10px rgba(215,188,120,.10);font-family:Amiri,serif;font-size:28px}.quote{font-family:Amiri,serif;font-size:23px;line-height:1.9;text-align:center;padding:18px}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.switch{width:52px;height:30px;border-radius:999px;background:#d7d3c6;position:relative}.switch:before{content:"";width:24px;height:24px;position:absolute;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on:before{right:25px}.player{background:#183b2d;color:#fff;border-radius:20px;padding:16px}.player .bar{height:6px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;margin:14px 0}.player .bar span{display:block;height:100%;width:35%;background:#d8bc78}.notice{background:#f2ead7;border:1px solid #e4d6b7;padding:12px;border-radius:15px;font-size:12px;color:#645a47}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.source{font-size:11px;color:var(--muted);line-height:1.8}.source a{color:var(--green)}.install{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.kbd{font-size:10px;color:var(--muted)}.developer-card{text-align:center;padding:20px}.developer-name{font-size:20px;font-weight:800;color:var(--green);letter-spacing:.2px}.developer-contact{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--green);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700;font-size:12px}.developer-note{font-size:10px;color:var(--muted);margin-top:9px}@media(min-width:760px){.screen{padding-left:clamp(16px,6vw,80px);padding-right:clamp(16px,6vw,80px)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:26px}.page-frame{max-width:900px;margin:auto;width:100%}.ayahs{font-size:30px;line-height:2.42}.mushaf-top{height:60px}.mushaf-controls{height:70px}}

<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="brand"><div class="brandmark">ﷲ</div><div><div class="brand-title" id="appName">اقرأ و ارتقى</div><div class="brand-sub">رفيقك اليومي مع القرآن</div></div></div>
    <button class="icon-btn" data-action="open-search">⌕</button>
  </header>
  <main class="screen" id="screen">
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-quran"></section>
    <section class="view" id="view-index"></section>
    <section class="view" id="view-athkar"></section>
    <section class="view" id="view-tools"></section>
    <section class="view" id="view-settings"></section>
  </main>
  <nav class="bottomnav" id="bottomnav">
    <button class="navbtn active" data-nav="home"><b>⌂</b><span>الرئيسية</span></button>
    <button class="navbtn" data-nav="quran"><b>۞</b><span>القرآن</span></button>
    <button class="navbtn" data-nav="index"><b>☰</b><span>الفهرس</span></button>
    <button class="navbtn" data-nav="athkar"><b>✦</b><span>الأذكار</span></button>
    <button class="navbtn" data-nav="tools"><b>⚙</b><span>المزيد</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="modal-card" id="modal-card"></div></div>
<script>
const API={quran:'https://api.alquran.cloud/v1',furqan:'https://alfurqan.online/api/v1',prayer:'https://api.aladhan.com/v1'};
const STORE='iqraa-wa-irtqi-v2';
const APP_NAME='اقرأ و ارتقى';
const defaultSettings={name:APP_NAME,theme:'light',fontSize:25,accent:'green',prayerMethod:5,city:'',adhan:true,iqama:true,reminder30:true,friday:true,tahajjud:false,reciter:'husary',athaanId:'',adhanOffset:0};
const state={page:1,totalPages:604,lastAyah:null,selected:null,nav:'home',pageCache:{},quranReady:false,audio:null,reciters:[],muezzins:[],athkar:[],athkarPos:0,adhkarCount:0};
let settings=loadSettings();
settings.muezzinId=settings.muezzinId||'';settings.muezzinName=settings.muezzinName||'';settings.muezzinUrl=settings.muezzinUrl||'';
function loadSettings(){try{return {...defaultSettings,...JSON.parse(localStorage.getItem(STORE+':settings')||'{}'),name:APP_NAME}}catch{return {...defaultSettings}}}
function saveSettings(){localStorage.setItem(STORE+':settings',JSON.stringify(settings)); applyTheme(); renderHome();}
function applyTheme(){document.documentElement.style.setProperty('--bg',settings.theme==='dark'?'#141a17':'#f6f2e8');document.documentElement.style.setProperty('--paper',settings.theme==='dark'?'#1b231f':'#fffdf6');document.documentElement.style.setProperty('--ink',settings.theme==='dark'?'#f3f0e6':'#1d2a22');document.documentElement.style.setProperty('--card',settings.theme==='dark'?'#1a211e':'#fbf9f1');document.documentElement.style.setProperty('--line',settings.theme==='dark'?'rgba(232,222,194,.13)':'rgba(22,61,45,.12)');document.documentElement.style.setProperty('--green',settings.theme==='dark'?'#2d7254':'#163d2d');document.body.classList.toggle('dark',settings.theme==='dark');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function getBookmarks(){try{return JSON.parse(localStorage.getItem(STORE+':bookmarks')||'[]')}catch{return []}}
function setBookmarks(v){localStorage.setItem(STORE+':bookmarks',JSON.stringify(v))}
function addBookmark(key){const a=getBookmarks(); if(!a.includes(key)){a.push(key);setBookmarks(a);toast('تمت إضافة العلامة');}else{setBookmarks(a.filter(x=>x!==key));toast('تمت إزالة العلامة')} renderReader()}
function isBookmarked(key){return getBookmarks().includes(key)}
function saveLast(){localStorage.setItem(STORE+':last',JSON.stringify({page:state.page,ayah:state.selected||null,time:Date.now()}))}
function getLast(){try{return JSON.parse(localStorage.getItem(STORE+':last')||'null')}catch{return null}}
function showView(name){state.nav=name;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const v=document.getElementById('view-'+name);if(v)v.classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));document.getElementById('screen').classList.toggle('reader',name==='quran');document.getElementById('topbar').classList.toggle('hidden',name==='quran');document.getElementById('bottomnav').classList.toggle('hidden',name==='quran');if(name==='home')renderHome();if(name==='index')renderIndex();if(name==='athkar')renderAthkar();if(name==='tools')renderTools();if(name==='settings')renderSettings();if(name==='quran' && !document.querySelector('#view-quran .mushaf-shell'))renderReader();}
async function api(url,options={}){const res=await fetch(url,{...options,headers:{'Accept':'application/json',...(options.headers||{})}});if(!res.ok)throw new Error('HTTP '+res.status);return res.json()}
async function getPage(n){
  n=Math.max(1,Math.min(604,Number(n)||1));
  if(state.pageCache[n]) return state.pageCache[n];
  const cached={page:n,svg:`https://api.islamic.app/v1/mushaf/page/${n}.svg?font=uthmani&theme=light&width=900`};
  state.pageCache[n]=cached;
  return cached;
}
async function cacheMushafPage(n){
  try{
    if(!('caches' in window)) return;
    const url=`https://api.islamic.app/v1/mushaf/page/${n}.svg?font=uthmani&theme=light&width=900`;
    const c=await caches.open('iqra-mushaf-pages-v2');
    if(!(await c.match(url))) await c.add(url);
  }catch(e){}
}
function openReader(page=state.page){state.page=Math.max(1,Math.min(state.totalPages,page));saveLast();showView('quran');renderReader();getPage(state.page).catch(()=>{});if(state.page<604)getPage(state.page+1).catch(()=>{});if(state.page>1)getPage(state.page-1).catch(()=>{});}
function qmark(num){return String(num).split('').map(ch=>['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][+ch]).join('')}
function renderReader(){
const el=document.getElementById('view-quran');el.innerHTML=`<div class="mushaf-shell" id="readerShell"><div class="mushaf-top"><button class="reader-btn" data-action="close-reader">‹</button><div class="center" id="pageMeta">المصحف الشريف</div><button class="reader-btn" data-action="reader-fullscreen">⛶</button><button class="reader-btn" data-action="reader-menu">☷</button></div><div class="mushaf-page" id="mushafPage"><div class="reader-swipe-hint">اسحب من اليسار إلى اليمين للصفحة التالية • ومن اليمين إلى اليسار للسابقة</div><div class="page-canvas" id="pageCanvas"><div class="page-frame"><div class="loading">جاري تحميل صفحة المصحف…</div></div></div><div class="page-footer"><span class="page-number" id="pageNumber">﴿ ${qmark(state.page)} ﴾</span></div></div><div class="mushaf-controls"><button class="reader-btn" data-action="prev-page">›</button><button class="reader-btn primary" data-action="page-picker">${qmark(state.page)}</button><button class="reader-btn" data-action="next-page">‹</button><button class="reader-btn" data-action="reader-share">↗</button></div></div>`;
loadReaderPage();setupSwipe();
}
async function loadReaderPage(){
  const canvas=document.getElementById('pageCanvas');
  const meta=document.getElementById('pageMeta');
  if(!canvas) return;
  const d=await getPage(state.page);
  const frame=document.createElement('div');
  frame.className='page-frame';
  frame.style.padding='10px';
  frame.style.display='flex';
  frame.style.alignItems='center';
  frame.style.justifyContent='center';
  frame.style.overflow='auto';
  const img=document.createElement('img');
  img.alt=`صفحة المصحف ${state.page}`;
  img.draggable=false;
  img.decoding='async';
  img.loading='eager';
  img.style.width='100%';
  img.style.height='100%';
  img.style.objectFit='contain';
  img.style.display='block';
  img.src=d.svg;
  img.onerror=()=>{
    frame.innerHTML='<div class="empty">تعذر تحميل صفحة المصحف. افتح التطبيق مرة واحدة مع الإنترنت ليتم تحميل الصفحة، ثم ستعمل الصفحات المحفوظة عندما يدعم المتصفح التخزين المؤقت.</div>';
  };
  frame.innerHTML='';
  frame.appendChild(img);
  canvas.innerHTML='';
  canvas.appendChild(frame);
  meta.textContent=`صفحة ${qmark(state.page)}`;
  document.getElementById('pageNumber').textContent=`﴿ ${qmark(state.page)} ﴾`;
  canvas.scrollTop=0;
}
function setupSwipe(){const el=document.getElementById('mushafPage');if(!el)return;let x=0,y=0,locked=false;el.ontouchstart=e=>{const t=e.changedTouches[0];x=t.clientX;y=t.clientY;locked=false};el.ontouchmove=e=>{const t=e.changedTouches[0];const dx=t.clientX-x;const dy=t.clientY-y;if(Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.15){e.preventDefault();locked=true}};el.ontouchend=e=>{const t=e.changedTouches[0];const dx=t.clientX-x;const dy=t.clientY-y;if(!locked||Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy))return;if(dx>0)nextPage();else prevPage()};}
function nextPage(){if(state.page<604){state.page++;state.selected=null;saveLast();getPage(state.page+1).then(()=>cacheMushafPage(state.page+1)).catch(()=>{});cacheMushafPage(state.page);renderReader()} else toast('وصلت إلى آخر صفحة');}
function prevPage(){if(state.page>1){state.page--;state.selected=null;saveLast();getPage(state.page-1).then(()=>cacheMushafPage(state.page-1)).catch(()=>{});cacheMushafPage(state.page);renderReader()}else toast('هذه أول صفحة')}

eturn}const rec=e.target.closest('[data-reciter]');if(rec){playReciter(rec.dataset.reciter);return}const ath=e.target.closest('[data-athkar]');if(ath){openModal(`<div class="modal-head"><h3>${esc(ath.dataset.athkar)}</h3><button class="close" data-action="close-modal">×</button></div><div class="quote">سبحان الله وبحمده</div><div class="notice">هذه الواجهة جاهزة لاستقبال بيانات أذكار موثقة مع المصدر والعدد. لا تُعرض هنا مجموعة غير منسوبة لمصدر.</div>`);return}const dt=e.target.closest('[data-dhikr]');if(dt){document.querySelectorAll('[data-dhikr]').forEach(x=>x.classList.remove('active'));dt.classList.add('active');document.getElementById('tbLabel').textContent=dt.dataset.dhikr}const lib=e.target.closest('[data-libtab]');if(lib){document.querySelectorAll('[data-libtab]').forEach(x=>x.classList.remove('active'));lib.classList.add('active');const box=document.getElementById('adhanLib');const data=window.__adhanLib;if(box&&data){if(lib.dataset.libtab==='iqama'){box.innerHTML=data.iqamas.map((x,i)=>`<div class=\"list-item\"><div><b>${qmark(i+1)} — ${esc(x)}</b><div class=\"meta\">ملف إقامة محلي/مرخّص — يمكن إضافة التسجيل من جهازك</div></div><button class=\"btn secondary\" data-action=\"upload-iqama\">إضافة ملف</button></div>`).join('')}else{box.innerHTML=data.muezzins.map((x,i)=>`<div class=\"list-item\"><div><b>${qmark(i+1)} — ${esc(x)}</b><div class=\"meta\">مكتبة أذان — المصدر المرخّص فقط</div></div><button class=\"btn secondary\" data-action=\"adhan-source\">المصدر</button></div>`).join('')}}return;}const it=e.target.closest('[data-index-tab]');if(it){document.querySelectorAll('[data-index-tab]').forEach(x=>x.classList.remove('active'));it.classList.add('active');const t=it.dataset.indexTab;if(t==='surahs')renderSurahs(window.__surahs||[]);else if(t==='juz'){document.getElementById('indexContent').innerHTML=Array.from({length:30},(_,i)=>`<button class="list-item" onclick="openReader(${1+Math.floor(i*604/30)})"><div><b>الجزء ${qmark(i+1)}</b><div class="meta">انتقال تقريبي إلى بداية الجزء ${qmark(i+1)}</div></div><span>‹</span></button>`).join('')}else if(t==='hizb'){document.getElementById('indexContent').innerHTML=Array.from({length:60},(_,i)=>`<button class="list-item" onclick="openReader(${1+Math.floor(i*604/60)})"><div><b>الحزب ${qmark(i+1)}</b><div class="meta">فهرسة الحزب ضمن الصفحات</div></div><span>‹</span></button>`).join('')}else{document.getElementById('indexContent').innerHTML=Array.from({length:604},(_,i)=>`<button class="list-item" onclick="openReader(${i+1})"><div><b>صفحة ${qmark(i+1)}</b><div class="meta">فتح الصفحة مباشرة</div></div><span>‹</span></button>`).join('')}}});
