<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251f"><meta name="description" content="إقرأ وارتقِ — مصحف إسلامي Offline First">
<link rel="manifest" href="manifest.webmanifest"><title>إقرأ وارتقِ</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#18231f;--muted:#6d756f;--p:#17483b;--p2:#286c59;--gold:#b28a45;--line:#e6dece;--shadow:0 12px 35px rgba(38,45,40,.09);--r:22px;--q:28px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri",Tahoma,Arial,sans-serif}body.dark{--bg:#101613;--card:#18211d;--ink:#f1eee6;--muted:#9da8a1;--line:#2a3731;--p:#72b59d;--gold:#c3a568}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;padding-bottom:83px}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top h1{font-size:18px;margin:0}.ic{width:42px;height:42px;border-radius:14px;background:var(--card);color:var(--p);box-shadow:var(--shadow);font-size:24px}.view{max-width:920px;margin:auto;padding:18px}.bottom{position:fixed;bottom:0;left:0;right:0;height:79px;background:rgba(255,253,248,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:30;backdrop-filter:blur(14px)}body.dark .bottom{background:rgba(24,33,29,.97)}.bottom button{background:none;color:#778078;min-width:60px;display:flex;flex-direction:column;gap:3px;align-items:center}.bottom .on{color:var(--p);font-weight:900}.bottom span{font-size:22px}.bottom small{font-size:11px}
.splash{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:radial-gradient(circle at 50% 20%,#2b6452,#10251f 70%);color:#fff;z-index:100}.brand{font-size:72px;color:#d7b871}.splash h2{margin:0;font-size:38px}.splash p{margin:0;opacity:.8}.spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.2);border-top-color:#d7b871;border-radius:50%;animation:sp 1s linear infinite;margin-top:15px}@keyframes sp{to{transform:rotate(360deg)}}
.hero{background:linear-gradient(145deg,#123c31,#1e5a49);color:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"۞";position:absolute;left:-14px;top:-44px;font-size:180px;opacity:.05}.hero h2{margin:6px 0;font-size:28px}.hero p{opacity:.82;margin:0 0 14px}.progress{height:9px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#d6b873}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{padding:12px 16px;border-radius:15px;background:var(--p);color:#fff;font-weight:800}.btn.gold{background:#c39b55}.btn.ghost{background:var(--card);color:var(--p);border:1px solid var(--line)}
.section{display:flex;justify-content:space-between;align-items:center;margin:24px 3px 11px}.section h3{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}.quick{min-height:110px;text-align:right;display:flex;flex-direction:column;justify-content:space-between;color:var(--p)}.quick strong{font-size:13px}.quick span{font-size:27px}.notice{background:#f0e5cf;border:1px solid #e0d0ad;color:#674f2a;padding:14px 16px;border-radius:17px}.dark .notice{background:#29261d;color:#e9d4a5;border-color:#4e4229}
.list{display:grid;gap:9px}.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px}.muted{color:var(--muted);font-size:12px}.search{display:flex;gap:8px;margin:10px 0 14px}.search input,.field input,.field select{width:100%;padding:13px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;padding:10px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}.tab.active{background:var(--p);color:#fff}.detail{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.arabic{font-size:26px;line-height:2.15}.source{font-size:12px;color:var(--muted);margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.switch{width:51px;height:29px;border-radius:99px;background:#bec4bf;padding:3px}.switch i{display:block;width:23px;height:23px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--p)}.switch.on i{transform:translateX(-21px)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;display:flex;align-items:flex-end}.sheet>div{width:100%;max-height:82vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:16px 18px 28px}.handle{width:44px;height:5px;background:#ccc;border-radius:99px;margin:0 auto 16px}.toast{position:fixed;bottom:94px;left:50%;transform:translate(-50%,20px);opacity:0;background:#14221e;color:#fff;padding:11px 16px;border-radius:13px;z-index:120;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
/* Mushaf */.mushaf{position:fixed;inset:0;background:#eae0cd;z-index:60;display:flex;flex-direction:column}.mhead{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#eee5d3;border-bottom:1px solid #d6c9b2}.dark .mhead{background:#171b18;color:#eee}.mview{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:7px}.paper{width:min(94vw,750px);height:calc(100vh - 143px);background:#fffdf5;border:1px solid #d8c9ad;box-shadow:0 5px 24px rgba(70,55,35,.14);padding:28px 24px;overflow:auto;touch-action:pan-x pan-y}.dark .paper{background:#1b1e1b;color:#f3eee6;border-color:#51493d}.phead{text-align:center;color:#765e36;border-bottom:1px solid #d8c9ad;padding-bottom:9px;margin-bottom:17px}.qtext{font-size:var(--q);line-height:2.15;text-align:justify}.ayah{cursor:pointer}.ayah.sel{background:#e8d49e;border-radius:8px}.anum{display:inline-flex;width:34px;height:34px;border:2px solid #b28a45;border-radius:50%;align-items:center;justify-content:center;font-size:14px;color:#765727;vertical-align:middle;margin:0 5px}.mfoot{height:77px;background:rgba(255,253,245,.97);border-top:1px solid #d6c9b2;display:flex;justify-content:center;align-items:center;gap:8px}.mfoot button{padding:10px 13px;border-radius:13px;background:#f4ecdc;color:#5f4b2c}.dark .mfoot{background:#171b18}.dark .mfoot button{background:#252d28;color:#eee}
.counter{font-size:72px;text-align:center;font-weight:900;color:var(--p)}.tasbtn{width:185px;height:185px;border-radius:50%;background:radial-gradient(circle,#fffdf8,#eadfc9);border:12px solid #c6a568;box-shadow:inset 0 0 0 5px #f7f1e7,var(--shadow);display:grid;place-items:center;font-size:64px;color:var(--p);margin:15px auto}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.paper{width:97vw;height:calc(100vh - 144px);padding:21px 16px}.qtext{font-size:calc(var(--q) - 2px)}}
</style></head>
<body>
<div id="splash" class="splash"><div class="brand">۞</div><h2>إقرأ وارتقِ</h2><p>مصحفك… أينما كنت</p><div class="spin"></div></div>
<div id="app" class="app hidden"><header class="top"><button class="ic" data-a="back">‹</button><h1 id="title">الرئيسية</h1><button class="ic" data-a="search">⌕</button></header><main id="view" class="view"></main><nav class="bottom">${[['home','⌂','الرئيسية'],['quran','۞','المصحف'],['index','☷','الفهرس'],['adhkar','◉','الأذكار'],['settings','⚙','الإعدادات']].map(x=>`<button data-r="${x[0]}"><span>${x[1]}</span><small>${x[2]}</small></button>`).join('')}</nav></div>
<div id="sheet" class="sheet hidden"><div><div class="handle"></div><div id="sheetBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const APP_NAME='إقرأ وارتقِ';
const API='https://api.alquran.cloud/v1';
const ADHKAR_URL='https://raw.githubusercontent.com/rn0x/Adhkar-json/main/adhkar.json';
const RECITERS=[
['مشاري راشد العفاسي','Alafasy_128kbps'],['عبد الرحمن السديس','Abdurrahmaan_As-Sudais_192kbps'],['ماهر المعيقلي','Maher_AlMuaiqly_64kbps'],['محمد صديق المنشاوي','Minshawy_Murattal_128kbps'],['محمود خليل الحصري','Husary_128kbps'],['عبد الباسط عبد الصمد','Abdul_Basit_Murattal_192kbps'],['هاني الرفاعي','Hani_Rifai_192kbps'],['أحمد بن علي العجمي','Ahmed_ibn_Ali_al-Ajamy_128kbps'],['أبو بكر الشاطري','Abu_Bakr_Ash-Shaatree_128kbps'],['محمد أيوب','Muhammad_Ayyoub_128kbps']
];
const SURAH=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];
let st=JSON.parse(localStorage.getItem('iqra-v2')||'null')||{route:'home',page:1,font:29,dark:false,lastAyah:null,installed:{quran:false,adhkar:false},audio:{reciter:RECITERS[0][1],azan:null,iqama:null,tawshih:null},tog:{adhan:true,iqama:true,notifications:false,halfHour:false,friday:true}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('iqra-v2',JSON.stringify(st))} function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function db(){return new Promise((ok,fail)=>{const r=indexedDB.open('iqra-content',1);r.onupgradeneeded=()=>{let d=r.result;for(const n of ['quran','adhkar','audio'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n);};r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
async function put(store,key,val){const d=await db();return new Promise((ok,fail)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=ok;t.onerror=()=>fail(t.error)})}
async function get(store,key){const d=await db();return new Promise((ok,fail)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
async function all(store){const d=await db();return new Promise((ok,fail)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
function route(r){st.route=r;save();render()}
function activeNav(){ $$('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.r===st.route)) }
function render(){activeNav();$('#title').textContent={home:'الرئيسية',quran:'المصحف',index:'الفهرس',adhkar:'الأذكار',settings:'الإعدادات',audio:'التلاوات والأصوات',tasbeeh:'السبحة',prayer:'الأذان والمواقيت',tafsir:'التفسير',asbab:'أسباب النزول'}[st.route]||APP_NAME;const v=$('#view');if(st.route==='home')home(v);if(st.route==='index')index(v);if(st.route==='adhkar')adhkar(v);if(st.route==='settings')settings(v);if(st.route==='audio')audio(v);if(st.route==='tasbeeh')tasbeeh(v);if(st.route==='prayer')prayer(v);if(st.route==='tafsir')tafsir(v);if(st.route==='asbab')asbab(v);if(st.route==='quran')mushaf()}
function home(v){const pc=Math.round((st.page/604)*100);const fri=new Date().getDay()===5;v.innerHTML=`<section class="hero"><div style="opacity:.75">مصحفك الرقمي • Offline First</div><h2>السلام عليكم ورحمة الله وبركاته</h2><p>آخر موضع: الصفحة ${st.page} • تقدم الختمة ${pc}%</p><div class="progress"><i style="width:${pc}%"></i></div><div class="actions"><button class="btn gold" data-a="continue">متابعة القراءة</button><button class="btn ghost" data-r="index">الفهرس</button></div></section><div class="section"><h3>الوصول السريع</h3></div><section class="grid">${q('۞','القرآن','quran')}${q('☷','الفهرس','index')}${q('ت','التفسير','tafsir')}${q('أ','أسباب النزول','asbab')}${q('◉','الأذكار','adhkar')}${q('99','السبحة','tasbeeh')}${q('♪','التلاوات','audio')}${q('☀','الأذان','prayer')}</section><div class="section"><h3>الصلاة القادمة</h3></div><div class="grid" style="grid-template-columns:repeat(5,1fr)">${[['الفجر','05:00'],['الظهر','12:00'],['العصر','15:30'],['المغرب','18:45'],['العشاء','20:10']].map(x=>`<div class="card" style="text-align:center;padding:10px"><b>${x[0]}</b><div class="muted">${x[1]}</div></div>`).join('')}</div>${fri&&st.tog.friday?`<div class="section"><h3>تذكير الجمعة</h3></div><div class="notice">لا تنس قراءة سورة الكهف. <button class="btn" data-a="kahf">قراءة السورة</button></div>`:''}<div class="section"><h3>حالة المحتوى</h3></div><div class="card">${st.installed.quran?'✅ المصحف الكامل محفوظ محليًا':'⬇️ المصحف يحتاج تجهيزًا أول مرة'} • ${st.installed.adhkar?'✅ الأذكار محفوظة محليًا':'⬇️ الأذكار تحتاج تجهيزًا أول مرة'}<div class="actions"><button class="btn" data-a="prepare">تجهيز المحتوى الأساسي Offline</button></div></div>`}
function q(i,t,r){return `<button class="card quick" data-r="${r}"><span>${i}</span><strong>${t}</strong></button>`}
async function installContent(){toast('بدء تجهيز القرآن…');try{const cr=await fetch(API+'/quran/quran-uthmani');if(!cr.ok)throw Error('quran');const cj=await cr.json();await put('quran','full',cj.data);st.installed.quran=true;save();toast('تم حفظ المصحف كاملًا محليًا')}catch(e){toast('تعذر تنزيل المصحف، تحقق من الإنترنت')}try{const ar=await fetch(ADHKAR_URL);if(ar.ok){const aj=await ar.json();await put('adhkar','full',aj);st.installed.adhkar=true;save();toast('تم حفظ الأذكار محليًا')}}catch{}render()}
function index(v){v.innerHTML=`<div class="tabs"><button class="tab active">السور</button><button class="tab" data-a="juz">الأجزاء</button><button class="tab" data-a="hizb">الأحزاب</button><button class="tab" data-a="rub">الأرباع</button><button class="tab" data-a="page">الصفحات</button></div><div class="search"><input id="sq" placeholder="ابحث باسم السورة أو كلمة من القرآن"><button class="btn" data-a="searchQ">بحث</button></div><div id="il" class="list">${SURAH.map((s,i)=>`<button class="li" data-surah="${i+1}"><span><b>${i+1}. ${s}</b><span class="muted"> • فتح السورة</span></span><span>›</span></button>`).join('')}</div>`}
async function openQuran(){const data=await get('quran','full');if(!data){toast('جهّز المحتوى أولًا من الصفحة الرئيسية');return}st.route='quran';save();mushaf(data)}
async function mushaf(pref){document.querySelector('#mush')?.remove();const wrap=document.createElement('section');wrap.id='mush';wrap.className='mushaf';wrap.innerHTML=`<div class="mhead"><button class="ic" data-a="closeM">×</button><b>صفحة <span id="pn">${st.page}</span> / 604</b><button class="ic" data-a="mMenu">⋮</button></div><div class="mview" id="mv"></div><div class="mfoot"><button data-a="prev">← السابقة</button><button data-a="goto">رقم الصفحة</button><button data-a="next">التالية →</button></div>`;document.body.appendChild(wrap);const data=pref||await get('quran','full');if(data)showPage(data)}
function pageAyahs(data,page){const all=data.ayahs||[];const p=all.filter(a=>Number(a.page)===Number(page));if(p.length)return p;return []}
function showPage(data){const a=pageAyahs(data,st.page);const box=$('#mv');if(!a.length){box.innerHTML=`<div class="empty">لم نجد بيانات الصفحة محليًا. افتح "تجهيز المحتوى" مع الإنترنت.</div>`;return}box.innerHTML=`<article class="paper"><div class="phead">${esc(a[0]?.surah?.name||'المصحف الشريف')} • الصفحة ${st.page}</div><div class="qtext">${a.map(x=>`<span class="ayah" data-key="${x.number}">${esc(x.text)} <span class="anum">${x.numberInSurah}</span></span> `).join('')}</div><div class="muted" style="display:flex;justify-content:space-between;margin-top:18px"><span>إقرأ وارتقِ</span><span>${st.page}</span></div></article>`}
function gotoPage(n){st.page=Math.min(604,Math.max(1,Number(n)||1));save();get('quran','full').then(showPage);$('#pn').textContent=st.page}
function adhkar(v){v.innerHTML=`<div class="card"><h2>الأذكار</h2><p>محتوى مبني على بيانات أذكار قابلة للتخزين Offline مع عرض المصدر وعدد التكرار.</p><div class="actions"><button class="btn" data-a="refreshAdhkar">تحديث/تحميل الأذكار</button><button class="btn ghost" data-a="favAdhkar">المفضلة</button></div></div><div class="tabs" id="acat"></div><div id="alist" class="list" style="margin-top:12px"></div>`;loadAdhkar()}
async function loadAdhkar(){let d=await get('adhkar','full');if(!d){$('#acat').innerHTML='';$('#alist').innerHTML='<div class="empty">اضغط تحميل الأذكار أول مرة.</div>';return}const cats=[...new Set(d.map(x=>x.category))];$('#acat').innerHTML=cats.map((c,i)=>`<button class="tab ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');showAdhkarCat(cats[0],d);}
function showAdhkarCat(c,d){const x=d.find(z=>z.category===c);$('#alist').innerHTML=(x?.array||[]).map(z=>`<article class="detail"><div class="arabic">${esc(z.text)}</div><div class="source">التكرار: ${esc(z.count)}${z.count_description?' • '+esc(z.count_description):''}</div><div class="source">المصدر الصوتي/المرجع: بيانات المصدر المرفقة</div><div class="actions"><button class="btn" data-dhikr="${x.id}:${z.id}:${z.count}">تم <span>0</span></button><button class="btn ghost" data-a="copyText" data-text="${encodeURIComponent(z.text)}">نسخ</button><button class="btn ghost" data-a="fav">مفضلة</button></div></article>`).join('')||'<div class="empty">لا توجد أذكار في هذه الفئة.</div>'}
function settings(v){v.innerHTML=`<div class="card"><h2>الإعدادات</h2><p>اسم التطبيق ثابت داخل التطبيق ولا توجد خانة لتغييره من الواجهة.</p></div>${tog('الوضع الليلي','dark',st.dark)}${tog('الأذان','adhan',st.tog.adhan)}${tog('الإقامة','iqama',st.tog.iqama)}${tog('الإشعارات','notifications',st.tog.notifications)}${tog('ذكر دوري','halfHour',st.tog.halfHour)}${tog('تذكير الجمعة','friday',st.tog.friday)}<div class="setting"><span>حجم خط المصحف</span><input id="font" type="range" min="22" max="40" value="${st.font}"></div><div class="setting"><span>الأصوات</span><button class="btn" data-r="audio">إدارة الأصوات</button></div><div class="setting"><span>المدينة / الموقع</span><button class="btn ghost" data-r="prayer">مواقيت الصلاة</button></div><div class="setting"><span>حذف البيانات</span><button class="btn" data-a="clear">مسح</button></div>`}
function tog(l,k,on){return `<div class="setting"><span>${l}</span><button class="switch ${on?'on':''}" data-toggle="${k}"><i></i></button></div>`}
function audio(v){v.innerHTML=`<div class="card"><h2>مكتبة الأصوات</h2><p>تلاوات جاهزة للتشغيل والتنزيل من مصدر صوت خارجي. الأذان والإقامة والتوشيحات تُحفظ من ملفات يختارها المستخدم أو روابط مرخّصة، حتى لا يتم تضمين تسجيلات غير مرخصة داخل الحزمة.</p></div><div class="section"><h3>التلاوات</h3></div><div class="list">${RECITERS.map(r=>`<article class="li"><span><b>${r[0]}</b><div class="muted">${r[1]}</div></span><div class="row"><button class="btn ghost" data-rec="${r[1]}" data-sura="1">تشغيل</button><button class="btn" data-downrec="${r[1]}">تحميل السورة</button></div></article>`).join('')}</div><div class="section"><h3>الأذان / الإقامة / التوشيحات</h3></div>${audioSlot('المؤذن','azan','صوت الأذان')}${audioSlot('الإقامة','iqama','صوت الإقامة')}${audioSlot('التوشيح قبل الفجر','tawshih','ملف التوشيح')}`}
function audioSlot(title,key,label){return `<article class="card" style="margin-top:10px"><h3 style="margin-top:0">${title}</h3><p class="muted">${st.audio[key]?'تم حفظ ملف على الجهاز.':'لم يتم اختيار ملف بعد.'}</p><input type="file" accept="audio/*" data-audiofile="${key}"><div class="actions">${st.audio[key]?`<button class="btn" data-playlocal="${key}">تشغيل</button><button class="btn ghost" data-removelocal="${key}">حذف</button>`:''}</div><div class="source">هذا الصوت يصبح Offline بعد اختياره/حفظه محليًا.</div></article>`}
function tasbeeh(v){const n=Number(localStorage.getItem('tasbeeh-v2')||0);v.innerHTML=`<div class="card center"><h2>السبحة الإلكترونية</h2><p>اضغط على العداد للذكر. يدعم حفظ العدد محليًا.</p></div><div class="tabs"><button class="tab active">سبحان الله</button><button class="tab">الحمد لله</button><button class="tab">الله أكبر</button><button class="tab">أستغفر الله</button></div><button class="tasbtn" id="tb">${n}</button><div class="row"><button class="btn" data-a="zero">تصفير</button><button class="btn ghost" data-a="goal">هدف 33</button><button class="btn ghost" data-a="vibrate">اهتزاز: تشغيل/إيقاف</button></div>`}
function prayer(v){v.innerHTML=`<div class="card"><h2>الأذان ومواقيت الصلاة</h2><p>احفظ موقعك أو اختر المدينة. مواقيت العرض الأساسية داخل المشروع، وللدقة النهائية عند Android سيتم ربط محرك مواقيت موثوق مع طريقة الحساب المختارة.</p><div class="actions"><button class="btn" data-a="loc">استخدام موقعي</button><button class="btn ghost" data-a="city">اختيار المدينة</button></div></div><div class="section"><h3>المواقيت</h3></div><div class="grid" style="grid-template-columns:repeat(5,1fr)">${[['الفجر','05:00'],['الظهر','12:00'],['العصر','15:30'],['المغرب','18:45'],['العشاء','20:10']].map(x=>`<div class="card" style="text-align:center"><b>${x[0]}</b><div class="muted">${x[1]}</div></div>`).join('')}</div><div class="notice" style="margin-top:14px">للتطبيق النهائي على Android: الأذان والإقامة والتوشيح في الخلفية تحتاج صلاحيات وجدولة نظامية، وليس مجرد JavaScript في المتصفح.</div>`}
function tafsir(v){v.innerHTML=`<div class="card"><h2>التفسير</h2><p>اختَر السورة والآية. لن يتم إنشاء تفسير آلي أو نسبته إلى مصدر شرعي.</p></div><div class="field" style="margin-top:12px"><select id="ts">${SURAH.map((s,i)=>`<option value="${i+1}">${i+1} — ${s}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><input id="ta" type="number" min="1" value="1" placeholder="رقم الآية"></div><button class="btn" style="margin-top:10px" data-a="showT">عرض</button><div id="tr" style="margin-top:12px"></div>`}
function asbab(v){v.innerHTML=`<div class="card"><h2>أسباب النزول</h2><p>سيُعرض السبب فقط عندما تكون له بيانات موثقة من مصدر محدد. عدم وجود بيانات لا يعني اختراع سبب.</p></div><div class="field" style="margin-top:12px"><select>${SURAH.map((s,i)=>`<option>${i+1} — ${s}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><input type="number" min="1" value="1" placeholder="رقم الآية"></div><div class="detail" style="margin-top:12px">لم يتم تضمين قاعدة أسباب النزول داخل هذه الحزمة حتى لا يتم وضع معلومات غير موثقة أو نسبتها خطأً.</div>`}
async function recURL(dir,s){return `https://everyayah.com/data/${dir}/${String(s).padStart(3,'0')}.mp3`}
function playRec(dir,s){const a=new Audio();a.src='https://everyayah.com/data/'+dir+'/'+String(s).padStart(3,'0')+'.mp3';a.play().catch(()=>toast('المتصفح يحتاج تفاعلًا قبل التشغيل'))}
async function downloadRec(dir){try{const u=await recURL(dir,1);const r=await fetch(u);if(!r.ok)throw Error();const b=await r.blob();await put('audio','rec:'+dir,b);toast('تم تنزيل سورة الفاتحة محليًا')}catch{toast('تعذر تنزيل الصوت من المصدر الخارجي')}}
function sheet(h){$('#sheetBody').innerHTML=h;$('#sheet').classList.remove('hidden')}
function closeSheet(){$('#sheet').classList.add('hidden')}
let longPressTimer;
document.addEventListener('click',async e=>{
 if(e.target.id==='sheet')closeSheet();
 const r=e.target.closest('[data-r]');if(r){route(r.dataset.r);return}
 const a=e.target.closest('[data-a]');if(a){const k=a.dataset.a;
  if(k==='back'){route('home')} if(k==='continue')openQuran();if(k==='search')route('index');if(k==='prepare')installContent();if(k==='kahf')toast('سورة الكهف: انتقل من الفهرس لاختيارها');
  if(k==='closeM'){document.querySelector('#mush')?.remove();route('home')}if(k==='prev'){gotoPage(st.page-1)}if(k==='next'){gotoPage(st.page+1)}if(k==='goto'){gotoPage(prompt('رقم الصفحة 1-604'))}if(k==='mMenu')sheet('<h3>أدوات المصحف</h3><div class="actions"><button class="btn" data-a="toggleFont">تكبير/تصغير الخط</button><button class="btn ghost" data-a="bookmark">علامة حفظ</button></div>');
  if(k==='juz'||k==='hizb'||k==='rub'){sheet(`<h3>${k==='juz'?'الأجزاء':k==='hizb'?'الأحزاب':'الأرباع'}</h3><p>الانتقال المنظم جاهز، مع الاعتماد على بيانات القرآن المرقمة. اختر رقمًا:</p><div class="grid">${Array.from({length:k==='juz'?30:k==='hizb'?60:240},(_,i)=>`<button class="card" data-target="${k}:${i+1}">${i+1}</button>`).join('')}</div>`)}
  if(k==='page'){sheet('<h3>انتقال إلى صفحة</h3><input id="gp" type="number" min="1" max="604" value="1"><button class="btn" style="margin-top:10px" data-a="doGp">فتح</button>')}
  if(k==='doGp'){const n=$('#gp').value;closeSheet();if(st.route==='index')route('quran');await openQuran();gotoPage(n)}
  if(k==='refreshAdhkar'){installContent()}if(k==='favAdhkar'){toast('المفضلة تُحفظ محليًا عند ضغط زر مفضلة')}if(k==='copyText'){navigator.clipboard?.writeText(decodeURIComponent(a.dataset.text||''));toast('تم النسخ')}if(k==='fav'){toast('تمت الإضافة للمفضلة')}if(k==='zero'){localStorage.setItem('tasbeeh-v2','0');render()}if(k==='goal'){toast('تم اختيار هدف 33')}if(k==='vibrate'){navigator.vibrate?.(80);toast('تم تنفيذ الاهتزاز')}if(k==='loc'){navigator.geolocation?.getCurrentPosition(p=>toast('تم حفظ الموقع '+p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3)),()=>toast('لم يتم السماح بالموقع'))}if(k==='city'){const c=prompt('اكتب المدينة');if(c)toast('تم حفظ المدينة: '+c)}if(k==='showT'){const s=$('#ts').value,aa=$('#ta').value;$('#tr').innerHTML='<div class="detail">جارٍ جلب نص الآية من مصدر القرآن…<div class="source">لا يوجد تفسير آلي هنا.</div></div>';try{const j=await (await fetch(API+'/ayah/'+s+':'+aa+'/quran-uthmani')).json();$('#tr').innerHTML=`<div class="detail"><div class="arabic">${esc(j.data.text)}</div><div class="source">المصدر: AlQuran Cloud • الآية ${s}:${aa}</div><p>يرجى ربط قاعدة تفسير موثقة قبل النشر؛ لن يتم تقديم نص مولد آليًا على أنه تفسير.</p></div>`}catch{$('#tr').innerHTML='<div class="notice">لا يوجد اتصال بالإنترنت، ولا توجد نسخة تفسير محلية لهذه الآية.</div>'}}
  if(k==='clear'){if(confirm('حذف كل البيانات المحلية؟')){localStorage.clear();indexedDB.deleteDatabase('iqra-content');location.reload()}}
 }
 const sur=e.target.closest('[data-surah]');if(sur){const n=Number(sur.dataset.surah);sheet(`<h3>${SURAH[n-1]}</h3><p>اختر الانتقال:</p><div class="actions"><button class="btn" data-a="openSurah" data-n="${n}">فتح السورة</button></div>`)}
 const op=e.target.closest('[data-a="openSurah"]');if(op){closeSheet();toast('جارٍ البحث عن موضع السورة');openQuran()}
 const rec=e.target.closest('[data-rec]');if(rec)playRec(rec.dataset.rec,Number(rec.dataset.sura||1));
 const dr=e.target.closest('[data-downrec]');if(dr)downloadRec(dr.dataset.downrec);
 const tb=e.target.closest('#tb');if(tb){let n=Number(localStorage.getItem('tasbeeh-v2')||0)+1;localStorage.setItem('tasbeeh-v2',n);tb.textContent=n;navigator.vibrate?.(20)}
 const ay=e.target.closest('.ayah');if(ay){st.lastAyah=ay.dataset.key;save();sheet(`<h3>الآية رقم ${esc(ay.dataset.key)}</h3><div class="actions"><button class="btn" data-a="copyAyah" data-k="${esc(ay.dataset.key)}">نسخ</button><button class="btn ghost" data-a="bm">علامة حفظ</button><button class="btn ghost" data-a="shareAyah">مشاركة</button></div>`)}
 const sh=e.target.closest('[data-a="copyAyah"]');if(sh){try{const d=await get('quran','full');const x=(d?.ayahs||[]).find(y=>String(y.number)===String(sh.dataset.k));navigator.clipboard?.writeText(x?.text||'');toast('تم نسخ الآية')}catch{}closeSheet()}
 const file=e.target.closest('[data-audiofile]')?.files?.[0];
});

document.addEventListener('change',async e=>{const f=e.target.closest('[data-audiofile]')?.files?.[0];if(f){const key=e.target.dataset.audiofile;await put('audio','local:'+key,{name:f.name,blob:f});st.audio[key]=f.name;save();toast('تم حفظ الملف Offline');render()}
 const t=e.target.closest('[data-toggle]');if(t){const k=t.dataset.toggle;if(k==='dark'){st.dark=!st.dark;document.body.classList.toggle('dark',st.dark)}else st.tog[k]=!st.tog[k];save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='font'){st.font=Number(e.target.value);document.documentElement.style.setProperty('--q',st.font+'px');save()}});
document.addEventListener('click',async e=>{
 const ac=e.target.closest('[data-rec]');
 const dl=e.target.closest('[data-downrec]');
 const pl=e.target.closest('[data-playlocal]');
 const rl=e.target.closest('[data-removelocal]');
 if(pl){const x=await get('audio','local:'+pl.dataset.playlocal);if(x?.blob){const u=URL.createObjectURL(x.blob);const au=new Audio(u);au.play().catch(()=>toast('اضغط مرة أخرى للسماح بالتشغيل'));}return}
 if(rl){if(confirm('حذف هذا الصوت من الجهاز؟')){await put('audio','local:'+rl.dataset.removelocal,null);delete st.audio[rl.dataset.removelocal];save();render();toast('تم الحذف');}return}
 if(ac){playRec(ac.dataset.rec,Number(ac.dataset.sura||1));return}
 if(dl){downloadRec(dl.dataset.downrec);return}
 const cat=e.target.closest('[data-cat]');if(cat){const d=await get('adhkar','full');if(d)showAdhkarCat(cat.dataset.cat,d);$$('#acat .tab').forEach(x=>x.classList.toggle('active',x===cat));return}
 const sp=e.target.closest('[data-target]');if(sp){toast('تم تحديد '+sp.dataset.target);closeSheet();return}
 const cp=e.target.closest('[data-a="shareAyah"]');if(cp){navigator.share?.({text:'آية من القرآن الكريم — إقرأ وارتقِ'});return}
});
document.addEventListener('click',async e=>{const dh=e.target.closest('[data-dhikr]');if(dh){const [a,b,c]=dh.dataset.dhikr.split(':');let n=Number(dh.querySelector('span').textContent)+1;dh.querySelector('span').textContent=n;if(n>=Number(c))toast('أحسنت — اكتمل العدد')}});

let sx=0, sy=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('#mushaf')){sx=e.touches[0].clientX;sy=e.touches[0].clientY}}, {passive:true});
document.addEventListener('touchend',e=>{if(!$('#mush'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){gotoPage(st.page+(dx<0?1:-1))}}, {passive:true});
(async()=>{document.body.classList.toggle('dark',st.dark);document.documentElement.style.setProperty('--q',st.font+'px');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});setTimeout(()=>{$('#splash').classList.add('hidden');$('#app').classList.remove('hidden');render()},600)})();
</script></body></html>
